name: Kappa.5.14 Durable Recovery Protocol Versioning
on:
  pull_request:
    branches: [main]
  push:
    branches: [product-kappa514-durable-recovery-protocol-versioning]

jobs:
  durable-recovery-protocol-versioning:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: missing
          POSTGRES_PASSWORD: missing
          POSTGRES_DB: missing_kappa514
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U missing -d missing_kappa514"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full test suite
        run: npm test
      - name: TypeScript build
        run: npm run build
      - name: Run Kappa.5.14 durable recovery protocol versioning proof
        env:
          MISSING_POSTGRES_URL: postgresql://missing:missing@127.0.0.1:5432/missing_kappa514?sslmode=disable
          MISSING_POSTGRES_SSLMODE: disable
        run: npx tsx src/experimentKappa514.ts
      - name: Verify Kappa.5.14 evidence exists
        run: test -s artifacts/product-kappa514-durable-recovery-protocol-versioning.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-kappa514-durable-recovery-protocol-versioning
          path: artifacts/product-kappa514-durable-recovery-protocol-versioning.json
          if-no-files-found: warn

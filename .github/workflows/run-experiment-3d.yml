name: Run MISSING Experiment 3D

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment-3d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run Experiment 3D Live MCP Tool Discovery
        run: npm run benchmark:3d

      - name: Upload Experiment 3D results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-experiment-3d-results
          path: results/experiment-3d/*.json
          if-no-files-found: error
          retention-days: 30

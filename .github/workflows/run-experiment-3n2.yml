name: Run MISSING Experiment 3N2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment-3n2:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run benchmark:3n2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-experiment-3n2-results
          path: results/experiment-3n2/*.json
          if-no-files-found: error
          retention-days: 30

name: Run MISSING Experiment 3W-R

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment-3wr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run benchmark:3wr
      - uses: actions/upload-artifact@v4
        with:
          name: missing-experiment-3wr-results
          path: results/experiment-3wr/*.json
          if-no-files-found: error
          retention-days: 30

name: Kappa.5.7 Crash Consistency Restart Recovery
on:
  push:
    branches: [product-kappa57-crash-consistency-restart-recovery]
  pull_request:
    branches: [main]

jobs:
  crash-consistency-restart-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: missing
          POSTGRES_PASSWORD: missing
          POSTGRES_DB: missing_kappa57
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U missing -d missing_kappa57"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full test suite
        run: npm test
      - name: TypeScript build
        run: npm run build
      - name: Kappa.5.7 crash consistency and restart recovery proof
        env:
          MISSING_DISTRIBUTED_MONEY_ENABLED: "1"
          MISSING_TRANSACTIONAL_RESPONSE_CACHE_ENABLED: "0"
          MISSING_POSTGRES_URL: postgresql://missing:missing@127.0.0.1:5432/missing_kappa57?sslmode=disable
          MISSING_POSTGRES_SSLMODE: disable
          MISSING_POSTGRES_POOL_MAX: "4"
          MISSING_POSTGRES_TIMEOUT_MS: "10000"
        run: npx tsx src/experimentKappa57.ts
      - name: Verify Kappa.5.7 evidence exists
        run: test -s artifacts/product-kappa57-crash-consistency-restart-recovery.json
      - name: Upload Kappa.5.7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-kappa57-crash-consistency-restart-recovery
          path: artifacts/product-kappa57-crash-consistency-restart-recovery.json
          if-no-files-found: warn

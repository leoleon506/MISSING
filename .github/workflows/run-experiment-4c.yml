name: Run MISSING Experiment 4C

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment-4c:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Run 4C typed request evidence benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini-2025-04-14
        run: npm run benchmark:4c
      - uses: actions/upload-artifact@v4
        with:
          name: missing-experiment-4c-results
          path: results/experiment-4c/*.json
          if-no-files-found: error
          retention-days: 30

name: Run MISSING Experiment 1B

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment-1b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Run Experiment 1B
        run: npm run benchmark:1b
      - name: Upload Experiment 1B results
        uses: actions/upload-artifact@v4
        with:
          name: missing-experiment-1b-results
          path: results/experiment-1b/*.json
          if-no-files-found: error
          retention-days: 30

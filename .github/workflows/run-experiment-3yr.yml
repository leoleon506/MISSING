name: Run MISSING Experiment 3Y-R

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment-3yr:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run benchmark:3yr
      - uses: actions/upload-artifact@v4
        with:
          name: missing-experiment-3yr-results
          path: results/experiment-3yr/*.json
          if-no-files-found: error
          retention-days: 30

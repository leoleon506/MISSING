name: Experiment 4U Preflight

on:
  push:
    branches:
      - experiment-4u-spec-qualified-lazy-openapi-universal-frozen-proof

permissions:
  contents: write

jobs:
  preflight:
    if: github.event.head_commit.message != 'Update package lock for 4U YAML parser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate deterministic package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update package lock for 4U YAML parser"
            git push
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build

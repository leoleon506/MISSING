name: Run MISSING Experiment 2B

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment-2b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run Experiment 2B Compositional Capability Forge
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          OPENAI_BASE_URL: https://api.openai.com/v1
          AGENT_PROVIDER: openai
        run: |
          test -n "$OPENAI_API_KEY"
          npm run benchmark:2b

      - name: Upload Experiment 2B results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-experiment-2b-results
          path: results/experiment-2b/*.json
          if-no-files-found: error
          retention-days: 30

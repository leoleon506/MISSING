name: Run MISSING Experiment 1E

on:
  workflow_dispatch:

jobs:
  experiment-1e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Run Experiment 1E
        run: npm run benchmark:1e
      - name: Upload Experiment 1E results
        uses: actions/upload-artifact@v4
        with:
          name: missing-experiment-1e-results
          path: results/experiment-1e/*.json
          if-no-files-found: error
          retention-days: 30

name: Operational Readiness 2 Observability SLO
on:
  push:
    branches: [operational-readiness-2-observability-slo]
  pull_request:
    branches: [main]

jobs:
  observability-slo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: missing
          POSTGRES_PASSWORD: missing
          POSTGRES_DB: missing_or2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U missing -d missing_or2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full test suite
        run: npm test
      - name: TypeScript build
        run: npm run build
      - name: Operational observability and SLO proof
        env:
          MISSING_POSTGRES_URL: postgresql://missing:missing@127.0.0.1:5432/missing_or2?sslmode=disable
          MISSING_POSTGRES_SSLMODE: disable
        run: npx tsx src/operationalReadiness2.ts
      - name: Verify evidence exists
        run: test -s artifacts/operational-readiness-2-observability-slo.json
      - uses: actions/upload-artifact@v4
        with:
          name: operational-readiness-2-observability-slo
          path: artifacts/operational-readiness-2-observability-slo.json

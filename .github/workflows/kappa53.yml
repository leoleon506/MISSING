name: Kappa.5.3 Two-Replica Exclusion
on:
  push:
    branches: [product-kappa53-two-replica-exclusion]
  pull_request:
    branches: [main]

jobs:
  two-replica-exclusion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: missing
          POSTGRES_PASSWORD: missing
          POSTGRES_DB: missing_kappa53
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U missing -d missing_kappa53"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MISSING_DISTRIBUTED_MONEY_ENABLED: "1"
      MISSING_TRANSACTIONAL_RESPONSE_CACHE_ENABLED: "0"
      MISSING_POSTGRES_URL: postgresql://missing:missing@127.0.0.1:5432/missing_kappa53?sslmode=disable
      MISSING_POSTGRES_SSLMODE: disable
      MISSING_KAPPA53_RACES: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Full test suite
        run: npm test
      - name: TypeScript build
        run: npm run build
      - name: Run Kappa.5.3 two-replica exclusion proof
        run: npx tsx src/experimentKappa53.ts
      - name: Upload Kappa.5.3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-kappa53-two-replica-exclusion
          path: artifacts/product-kappa53-two-replica-exclusion.json
          if-no-files-found: error

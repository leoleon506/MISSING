name: Kappa.5.11 Production Fence Propagation Heartbeat
on:
  pull_request:
    branches: [main]
  push:
    branches: [product-kappa511-production-fence-heartbeat]
jobs:
  production-fence-heartbeat:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: missing
          POSTGRES_PASSWORD: missing
          POSTGRES_DB: missing_kappa511
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U missing -d missing_kappa511"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        name: Full test suite
      - run: npm run build
        name: TypeScript build
      - name: Run Kappa.5.11 production fence heartbeat proof
        env:
          MISSING_X402_FACILITATOR_IDEMPOTENCY: "1"
          MISSING_POSTGRES_URL: postgresql://missing:missing@127.0.0.1:5432/missing_kappa511?sslmode=disable
          MISSING_POSTGRES_SSLMODE: disable
        run: npx tsx src/experimentKappa511.ts
      - name: Verify Kappa.5.11 evidence exists
        run: test -s artifacts/product-kappa511-production-fence-heartbeat.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-kappa511-production-fence-heartbeat
          path: artifacts/product-kappa511-production-fence-heartbeat.json
          if-no-files-found: warn

name: Run MISSING Experiment 3Y-I

on:
  workflow_dispatch:

jobs:
  experiment-3yi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run benchmark:3yi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: missing-experiment-3yi-results
          path: results/experiment-3yi/*.json
          if-no-files-found: error
          retention-days: 30

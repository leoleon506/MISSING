name: Run MISSING Experiment 5B15

on:
  workflow_dispatch:

jobs:
  experiment-5b15:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Run 5B15 deterministic replay resilience benchmark
        run: node --import tsx src/experiment5b15.ts
      - uses: actions/upload-artifact@v4
        with:
          name: missing-experiment-5b15-results
          path: results/experiment-5b15/*.json
